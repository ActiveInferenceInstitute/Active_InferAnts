version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/0_CONTEXT/Computer_Languages/JavaScript"
    schedule:
      interval: "weekly"
    groups:
      javascript-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/0_CONTEXT/Computer_Languages/TypeScript"
    schedule:
      interval: "weekly"
    groups:
      typescript-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
