# GitHub Actions CI for Active InferAnts
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile-sweep all Python sources
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || { echo "COMPILE FAIL: $f"; failed=1; }
          done < <(git ls-files -z '*.py')
          exit $failed
      - name: Run unit tests
        run: python -m pytest -q

  gnn-conformance:
    # Validates gnn/gaussian_agent.gnn.md with the upstream parser revision
    # pinned in gnn/upstream.json. The pinned revision is fetched from the
    # public repository at the recorded SHA into its own runtime; the strict
    # gate never skips, and tests/test_gnn_conformance.py fails (never skips)
    # when the explicitly selected GNN_ROOT checkout is missing or unusable.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Provision the pinned GNN parser runtime
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: |
          REVISION=$(python -c "import json; print(json.load(open('gnn/upstream.json'))['commit'])")
          TAG=$(python -c "import json; print(json.load(open('gnn/upstream.json'))['tag'])")
          git init --quiet "$GNN_ROOT"
          git -C "$GNN_ROOT" remote add origin \
            https://github.com/ActiveInferenceInstitute/Generalized_Notation_Notation.git
          # A pin that no longer resolves upstream fails here rather than skipping.
          git -C "$GNN_ROOT" fetch --depth 1 origin "$REVISION" "refs/tags/$TAG:refs/tags/$TAG"
          git -C "$GNN_ROOT" checkout --quiet --detach "$REVISION"
          python -m venv "$GNN_ROOT/.venv"
          # The pinned extractor needs numpy and defusedxml; a missing dependency
          # fails the run loudly instead of degrading to a skip.
          "$GNN_ROOT/.venv/bin/python" -m pip install --quiet numpy defusedxml
      - name: Validate the GNN specification against the pinned parser
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: python scripts/validate_gnn_spec.py
      - name: Run the pinned-upstream conformance tests
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: python -m pytest tests/test_gnn_conformance.py -q

      - name: Report the resolved GNN version
        run: |
          PIN=gnn/upstream.json
          VERSION=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'].removeprefix('v'))")
          test -n "$VERSION"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
