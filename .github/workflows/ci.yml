# Gate commands live only in run.sh. Local gates remain authoritative while
# organisation Actions billing is locked; this workflow is not hosted evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up the locked environment
        run: ./run.sh setup
      - name: Compatibility tests
        run: ./run.sh test-fast

  gnn-conformance:
    name: gnn conformance (pinned)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
      - name: Set up the locked environment
        run: ./run.sh setup
      - name: Lint
        run: ./run.sh lint
      - name: Documentation
        run: ./run.sh docs
      - name: Fast tests
        run: ./run.sh test-fast
      # The gnn selection complements test-fast; test-full would repeat it.
      # Parses only gnn/gaussian_agent.gnn.md at gnn/upstream.json's revision.
      - name: GNN conformance
        run: ./run.sh gnn
